[package]
name = "everything-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Everything-style file search with egui"

[dependencies]
anyhow = "1"
csv = "1"
eframe = { version = "0.32", default-features = false, features = ["glow"] }
egui_extras = "0.32"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 0

[profile.release]
# 2026-08-14: 16,185,812 -> 2,398,208 bytes, cold release 2m 15s
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
