[package]
name = "es-stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Folder file counts from Everything 1.4 and 1.5"
license = "MIT"
autotests = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
