[package]
name = "es-stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Folder file counts from Everything ESDb 1.7.20"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
